name: Probe European Sources

# Temporary: identifies a usable free source for per-club European fixtures.
# Delete once snapshot.py has one wired in.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/probe_european_sources.py
